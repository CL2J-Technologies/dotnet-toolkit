name: Publish NuGet Packages

# Releases. Pull requests are validated by ci.yml, which is a separate workflow because this one
# can publish to NuGet.org and should not run on branch contributions.
#
# Publishing uses NuGet.org Trusted Publishing: there is no long-lived API key to expire or leak.
# The job exchanges its GitHub OIDC token for a short-lived key (about an hour), which NuGet.org
# only issues to this repository's publish.yml, for packages matching `cl2j.*`. Renaming this
# file, moving the repository, or adding a job `environment:` breaks that match — update the
# policy on NuGet.org at the same time.
#
# The build and test steps below stay: this workflow must never pack an artifact it has not
# compiled and tested itself. ci.yml having passed on the pull request is not a substitute — main
# can differ from the branch that was reviewed.
on:
  push:
    branches: [main]

# Publishes are serialised rather than cancelled. Two merges in quick succession must not race on
# `dotnet nuget push`, and cancelling a release mid-push would leave part of a version set live.
concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Lets NuGet/login request the OIDC token.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack --no-build -c Release -o ./artifacts

      # Right before the push, so the short-lived key is not spent waiting on build and tests.
      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # The NuGet.org account that owns the cl2j.* packages and the trusted publishing policy.
          # The login succeeds for any account with a matching policy, but the push is then
          # refused with a 403 unless that account owns the packages.
          user: jfblier

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    env:
      DOTNET_NOLOGO: true
